services:
  mongodb:
    image: mongo:8
    container_name: portfolio-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: portfolio-server
    restart: unless-stopped

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/portfolio

    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: portfolio-client
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - server

    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongo-data: